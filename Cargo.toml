[package]
name = "ikigai-layers"
version = "0.5.0"
edition = "2021"
# The toolchain the shared CI's msrv job builds and tests on: the line the ecosystem's other
# declared crates (ikigai-script, ikigai-log, ikigai-cms-web) hold. Nothing here needs more
# than edition 2021; the RDF parsers (oxrdfio 0.2.6, oxttl 0.2.4) need 1.87.
rust-version = "1.89"
# MSRV-aware resolution (cargo's resolver 3): from each dependency's compatible range, the
# newest version that still builds on `rust-version`. CI commits no lockfile, so without it a
# fresh resolve can take a dependency that needs a newer toolchain than the msrv job runs.
resolver = "3"
license = "MIT OR Apache-2.0"
description = "A layer host for ikigai: independent shared spaces between participants (`urn:layer:{layer}`), each defined by configuration with an access model, closed SHACL admission shapes, an egress context, exact per-layer capabilities and its own gapless feed; collaborations are manifests (`urn:collab:{name}`) from which the door's enrollment is generated. Two access models: an append-only channel, and a tuplespace whose take is an atomic claim with a receipt."
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
repository = "https://github.com/ikigai-rs/ikigai-layers"
homepage = "https://github.com/ikigai-rs/ikigai-layers"
readme = "README.md"
keywords = ["ikigai", "roc", "collaboration", "capability", "rdf"]
categories = ["network-programming"]
# history/ is a record of the door, not part of the library.
exclude = ["history/"]

[features]
# **`host` is the layer host** (ledger #1403): `Host`, the layer space a door binds, the
# configuration, both access models, the feeds, the JSON faces, the enrollment generator and its
# binary. It is ON by default, so a consumer that names this crate plainly builds exactly what it
# built before. A PARTICIPANT, a tool that only talks to some layer door (the gateway's `Asker`
# and `Resolver` over QUIC, say), takes `default-features = false` and links the modules that
# need no host: `gateway`, `name`, `rdf`, `id` and `time`. Without `host` there is no
# ikigai-store, ikigai-intray, ikigai-shacl or ikigai-jsonld in the graph, and so no oxigraph
# and no RocksDB (`oxrocksdb-sys`, which intray's oxigraph builds by default): the ci.yml job
# `participant` checks that the tree stays free of them.
default = ["host"]
host = [
    "dep:der",
    "dep:ikigai-encrypt",
    "dep:ikigai-sign",
    "dep:ikigai-intray",
    "dep:ikigai-store",
    "dep:ikigai-shacl",
    "dep:ikigai-jsonld",
    "dep:oxrdfio",
    "dep:oxsdatatypes",
    "dep:pem-rfc7468",
    "dep:serde",
    "dep:sha2",
    "dep:toml",
]

# The enrollment generator is the host's: it reads the host's configuration.
[[bin]]
name = "ikigai-layers"
path = "src/bin/ikigai-layers.rs"
required-features = ["host"]

[dependencies]
# The published kernel, the SAME one the hosts link. **0.1.98 is a TESTED floor**: the API
# this crate calls arrived earlier (the principal a door mints into the capability,
# `Capability::principal`, and `Invocation::depends_on` on a failure, both 0.1.93; the layer
# vocabulary these graphs emit, 0.1.96), and 0.1.98 is the head every test here ran against,
# the one ikigai-intray 0.1.55 and ikigai-store 0.2.19 were released beside. (0.1.97 is
# YANKED; a resolve never picks it.)
# ⚠ `"0.1.98"` is a RANGE, `>=0.1.98, <0.2.0`: when core reaches 0.2 this line must move or
# the crate freezes out of it.
ikigai-core = "0.1.98"
# Shared triple-term nesting guard; 0.2.1 first exports the check and bound (0.2.0 does not).
# Also used by participants: adds oxrdfio and quick-xml, but no store or RocksDB.
ikigai-rdf = "0.2.1"
# The space a tuplespace layer fronts: intray's `urn:space:{name}` endpoint, linked and
# invoked privately under the host's own `urn:cap:space:*` (core gives an endpoint no way to
# issue above its caller's capability, so the space is a value the host owns, never a name it
# resolves). Its rename-based take is the atomic step every take here turns on. **0.1.69 is
# the floor this crate needs**: its `TupleCodec` hook (`SpaceEndpoint::with_codec`,
# ikigai-rs/ikigai-cli PR 570, ledger #2017) is how a tuple is sealed at rest while intray
# itself stores it, decodes it for `rd`, `take` and every `match=`, and re-encodes it after a key
# rotation (`reencode`); its `discard_staging` clears a crashed drop or claim at open, and
# `SPACE_DIRS` names every directory a space may hold. Every `match=` runs within an
# `EvaluationBudget` taken from its mounter (`with_evaluation_budget`, 0.1.55, ledger #1327),
# which is how every tuplespace layer of a host shares ONE overdue count (ledger #1362).
# ⚠ `"0.1.69"` is `<0.2.0`.
ikigai-intray = { version = "0.1.69", optional = true }
# The time budget a `match=` runs within (`ikigai_store::budget::{EvaluationBudget,
# TimeBudget}`): the host builds ONE from `layers.toml` and hands a clone to every tuplespace
# layer, and `Host::match_budget` exposes it. Named directly because those types are in this
# crate's API; it is the same store intray links (cargo unifies them). 0.2.19 is the current
# line and the one every test here ran against; `EvaluationBudget` arrived in 0.2.18.
# ⚠ `"0.2.19"` is `<0.3.0`.
ikigai-store = { version = "0.2.19", optional = true }
# `Endpoint::invoke` is `async_trait`, and every endpoint here carries the host's state.
async-trait = "0.1"
# `futures::lock::Mutex` serializes a layer's writes ACROSS the validation sub-request (an
# await), and `select` joins a feed's notifier with its timer.
futures = "0.3"
# A feed's `wait=` is a real-time bound with no runtime of this crate's choosing: one helper
# thread for every timer in the process, the shape core's own "no executor" rule asks for.
# ⚠ `"3"` is `>=3, <4`.
futures-timer = "3"
# A gateway reply carries a representation's bytes as `xsd:base64Binary` (`gateway`), so any
# participant, one that is not ikigai included, reads them with a standard decoder. 0.22.1 is the line the
# lock already held through the RDF stack. ⚠ `"0.22.1"` is `<0.23.0`.
base64 = "0.22.1"
# Layer definitions, manifests and enrollment are TOML (the config home's language); the
# feed's JSON face, the enrollment the generator writes and the validation report admission
# reads are JSON. `serde_json` alone is outside `host`: a participant's gateway reads a feed's
# `last` from its JSON face.
serde = { version = "1", features = ["derive"], optional = true }
serde_json = "1"
# ⚠ `"0.8"` is `<0.9`. 0.8.23 is the line the ecosystem's other TOML readers hold.
toml = { version = "0.8", optional = true }
# Admission's validator, LINKED and called by the host itself (`validate_report`), never a
# sub-request to `urn:shacl:validate`: a door that bound the validator for admission's sake
# offered it to every enrolled participant, since it declares no capability (ledger #1266).
# Linked, the door binds the layer space alone and nothing reaches the validator but a write
# the host is admitting. **Without default features** (ledger #1405): the rudof-free subset
# validator, which refuses BY NAME any construct outside its subset rather than skipping it.
# A layer host need not link rudof's network stack or its stack-overflow risk, and a consumer
# that takes this crate as a dev-dependency (gonk) no longer has rudof unified back into its
# TEST build, so its tests validate with the engine its binary ships. A host that wants rudof
# enables `ikigai-shacl/rudof` itself, and cargo unifies (cli does). **0.3.6 is the floor**: the
# first whose subset implements `sh:closed` and `sh:ignoredProperties`, which every layer's
# shapes use (`config.rs` refuses an open node shape); 0.3.5's subset refused every layer at
# open. `tests/subset.rs` validates every shipped shapes graph with the subset by name.
# ⚠ `"0.3.6"` is `<0.4.0`.
ikigai-shacl = { version = "0.3.6", default-features = false, optional = true }
# The JSON-LD faces (ledger #1371): every graph answer `as=application/ld+json` is the layer's
# egress context, pruned and compacted by `urn:jsonld:prune`, which the host evaluates in a
# kernel of its OWN (`json::Egress`) and binds into no space a door serves: the prune declares
# no capability, so bound in a door it would be offered to every participant (ledger #1266's
# shape). 0.2.2 is the first with `prune` and the line every test here ran against.
# ⚠ `"0.2.2"` is `<0.3.0`.
ikigai-jsonld = { version = "0.2.2", optional = true }
# Turtle and JSON-LD in (`say`'s content, the shapes and the participants graph), Turtle out.
# 0.3.4 / 0.2.4 / 0.2.6 are the model, serializer and parser oxigraph 0.5.11 uses, so the
# graph carries one of each beside ikigai-shacl in a host. oxrdfio's JSON-LD parser has no
# document loader unless one is installed, so a remote `@context` is refused, never fetched.
# ⚠ Each is a range under its 0.x minor (`<0.4.0`, `<0.3.0`, `<0.3.0`): move them together
# with oxigraph.
oxrdf = "0.3.4"
oxttl = "0.2.4"
oxrdfio = { version = "0.2.6", optional = true }
# State sealed at rest (`at_rest`, ledger #2011): every file the host writes is an age file
# sealed to the host's own recipient, through ikigai-encrypt's library face
# (`ikigai_encrypt::age`: `seal`, `open`, `parse_identities`, ledger #2016), the ecosystem's one
# implementation of age, so no cryptography and no `age` dependency of this crate's own. 0.2.1 is
# the first release with that face (0.2.0 had only the two endpoints). Without default features:
# no ikigai-core endpoints, no async-trait and no armor, so `seal` writes binary age and `open`
# reads it (armored input too if something else in the graph turns `armor` on, which the MAGIC
# prefix checks in `at_rest` make harmless). Its low-order recipient check is not needed here:
# every recipient is the host's own (`Identity::to_public`), never a low-order point.
# ⚠ `"0.2.1"` is `<0.3.0`.
ikigai-encrypt = { version = "0.2.1", default-features = false, optional = true }
# Onboarding (ledger #2009, `onboard`): an entitlement is applied only when its signature verifies
# against the controller's public key, and the host verifies through ikigai-sign's `urn:sign:verify`,
# evaluated in a kernel of the host's OWN that no door binds (the pattern `json::Egress` set): the
# ecosystem's one Ed25519 verifier, so no signature code here. 0.3.2 is the current release and the
# one every test here ran against; its `verify` (bytes, signature graph, SPKI key IRI) is older.
# ⚠ `"0.3.2"` is `<0.4.0`.
ikigai-sign = { version = "0.3.2", optional = true }
# An enrollment request carries its certificate as PEM, and the host checks that the certificate's
# leaf DER hashes to the fingerprint the request states, which must be the poster's own. PEM is
# decoded by RustCrypto's RFC 7468 decoder and the DER is checked as one well-formed DER document,
# the two crates ikigai-sign's key parsing (ed25519-dalek, p256, through pkcs8 and spki) already
# puts in the graph, so nothing new is compiled and nothing is hand-parsed. The SHA-256 is
# RustCrypto's 0.10 line, the one ikigai-sign links. (The fingerprint of a PEM has a shared home in
# ikigai-quic, `fingerprint_of_pem`, which a host cannot link without the whole QUIC transport.)
# ⚠ `"0.7.10"`, `"0.7.0"` and `"0.10.9"` are `<0.8.0`, `<0.8.0` and `<0.11.0`.
der = { version = "0.7.10", features = ["alloc"], optional = true }
pem-rfc7468 = { version = "0.7.0", features = ["alloc"], optional = true }
sha2 = { version = "0.10.9", optional = true }
# An entitlement's `onb:expires` is compared with the kernel clock as an `xsd:dateTime`, by the
# XSD datatype library oxigraph's SPARQL evaluation already links (0.2.4 is that line), never
# by a date parser of this crate's own. ⚠ `"0.2.4"` is `<0.3.0`: move it with oxigraph.
oxsdatatypes = { version = "0.2.4", optional = true }

[dev-dependencies]
# The module recipe as one test. 0.8.0 is the CURRENT published definition of "done", and
# the floor this suite needs: `Fixture::capability` (0.6.2) probes `urn:layers:me` and the
# write doors AS a minted participant instead of waiving their checks (ledger #1321), and
# `Suite::required_on_mutating` (0.8.0) holds `say` and `out` to REQUIRED (ledger #329).
# ⚠ `"0.8.0"` is `<0.9.0`: raise it when conformance moves, or this crate keeps reporting
# green against an old rulebook.
ikigai-conformance = "0.8.0"
# `TurtleRenderer` gives the test kernels a JSON Meta face (without one the engine's routing
# cannot be observed), and its `VOCABULARY` is the conformance suite's oracle: 0.1.96 is the
# first that defines the layer family these graphs use, so the dev pin is what makes the
# vocabulary check judge against it (cargo unifies the conformance crate's own `0.1.91`).
# 0.1.98 moves with core: one workspace, one version.
ikigai-vocab = "0.1.98"
# RDF 1.2 in the TEST build, as in every host that links this crate: a host's graph turns
# `rdf-12` on (rudof, through ikigai-shacl's default features, in gonk and the cli), and with
# it Turtle triple terms `<<( … )>>` parse. Through oxigraph's own feature, so oxrdf, oxttl,
# oxrdfio and the SPARQL crates turn it on together (each matches on it exhaustively). Without
# this the depth tests would only see a syntax error (ledger #2015).
oxigraph = { version = "0.5.11", default-features = false, features = ["rdf-12"] }

# The tests' independent oracle for the sealed files: `tests/at_rest.rs` and `tests/common`
# open what the host wrote, and seal plaintext fixtures, with `age` called directly, so a file
# the host seals through ikigai-encrypt is checked against age itself, not against the same
# code that wrote it. The line ikigai-encrypt 0.2.1 takes (`age = "0.11"`), so nothing new is
# compiled; a dev-dependency adds nothing to a consumer's build. ⚠ `"0.11.1"` is `<0.12.0`.
age = { version = "0.11.1", default-features = false }

# The onboarding tests' controller (and stranger) keys, GENERATED in each test from a seed the
# test chooses, never a real key: written as PKCS8 and SPKI PEM for ikigai-sign's `urn:sign:sign`
# and the host's `onboard.controller_key`. The line ikigai-sign links (`"2.1"`), so nothing new is
# compiled. ⚠ `"2.1"` is `<3.0.0`.
ed25519-dalek = { version = "2.1", default-features = false, features = ["std", "pkcs8", "pem"] }

[target.'cfg(unix)'.dev-dependencies]
# `tests/partial_write.rs` injects a torn write from outside the library by lowering the
# process's file-size limit (`setrlimit(RLIMIT_FSIZE)`, with `SIGXFSZ` ignored). Those calls
# and constants long predate 0.2.150, which is a conservative floor rather than a measured
# one; the tests ran against 0.2.190. ⚠ `"0.2.150"` is `<0.3.0`.
libc = "0.2.150"
