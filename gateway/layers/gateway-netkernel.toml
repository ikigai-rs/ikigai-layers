# A GATEWAY ask layer (ledger #1370), served as urn:layer:gateway-netkernel: where the kernel
# `netkernel` asks, and whoever resolves for it answers. One ask layer PER ASKER, because the layer
# is the read boundary (whoever holds `read` on a layer reads all of it): an asker's requests and
# replies are visible to that asker and to the resolvers serving it, and to no other asker.
#
# A tuplespace, ADDRESSED: a request is unaddressed (any resolver holding `take` may take it, and
# the atomic take means exactly one does) or addressed to one resolver; a reply names its request
# with ik:offer and is addressed to the asker, so the host admits it only from the request's taker
# and only the asker can take it.
#
# entry_max is the bound on ONE tuple, so on the representation a reply can carry (base64 costs a
# third): a resolver whose answer does not fit sends a gw:Failure instead.
model     = "tuplespace"
label     = "Gateway: NetKernel asks"
shapes    = "gateway.shapes.ttl"
context   = "gateway.context.jsonld"
addressed = true
entry_max = "1MiB"
