# A GATEWAY event channel (ledger #1370), served as urn:layer:gateway-events-plasma: where the
# kernel `plasma` says that one of ITS resources changed (gw:Invalidation: which resource, why),
# so a kernel that holds an answer it got through the gateway can drop it.
#
# One channel PER OWNER, and only the owner holds `say`: an event names a resource the sayer owns,
# so nobody can invalidate another kernel's resources. It carries no asker's identity and no
# request, so every kernel that may ask the owner reads it.
#
# `about` is the predicate `latest about=` reads: `latest about=<resource>` is the newest
# invalidation of that resource.
model   = "channel"
label   = "Gateway: plasma's invalidations"
shapes  = "gateway-events.shapes.ttl"
context = "gateway-events.context.jsonld"
about   = "urn:layers:gateway:resource"
